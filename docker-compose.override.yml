# ===========================================
# BioPlatform - Docker Compose Override (Development)
# ===========================================
# Este archivo se carga automáticamente junto con docker-compose.yml
# Agrega herramientas UI para gestionar la infraestructura en desarrollo

version: "3.8"

services:
  # Adminer - UI para SQL Server y PostgreSQL
  adminer:
    image: adminer:latest
    container_name: bioplatform-adminer
    ports:
      - "8090:8080"
    networks:
      - bioplatform-network
    depends_on:
      - sqlserver
      - postgres

  # pgAdmin - UI específica para PostgreSQL
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bioplatform-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5060:80"
    networks:
      - bioplatform-network
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # Seq - Logging centralizado (Serilog)
  seq:
    image: datalust/seq:2024.1
    container_name: bioplatform-seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - "5341:80"
    networks:
      - bioplatform-network
    volumes:
      - seq_data:/data

  # MongoDB - Logs (opcional, solo dev). Levantar con: docker compose --profile full up
  mongodb:
    image: mongo:7
    container_name: bioplatform-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - bioplatform-network
    profiles:
      - full

volumes:
  pgadmin_data:
  seq_data:
  mongodb_data:
