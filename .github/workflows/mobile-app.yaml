name: Frontend Mobile (Expo) CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'src/Bio.Frontend.Mobile/**'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'src/Bio.Frontend.Mobile/**'

jobs:
  build:
    name: Lint and Type-Check Expo App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/Bio.Frontend.Mobile

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './src/Bio.Frontend.Mobile/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint (Zero Warnings Policy)
      run: npx eslint . --max-warnings=0

    - name: Type Check (TypeScript)
      run: npx tsc --noEmit
