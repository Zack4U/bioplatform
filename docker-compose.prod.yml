# ===========================================
# BioPlatform Caldas - Docker Compose (Producción)
# ===========================================
# USO: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Variables se leen de .env (ver .env.prod.example).
# Incluye TODOS los servicios compilados y optimizados para producción.

version: "3.8"

services:
  # ===========================================
  # INFRAESTRUCTURA
  # ===========================================

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bioplatform-sqlserver-prod
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_SQL_PASSWORD}
      - MSSQL_PID=Standard
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - bioplatform-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  postgres:
    image: postgis/postgis:16-3.4
    container_name: bioplatform-postgres-prod
    environment:
      - POSTGRES_USER=${DB_PG_USER}
      - POSTGRES_PASSWORD=${DB_PG_PASSWORD}
      - POSTGRES_DB=${DB_PG_DATABASE}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bioplatform-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_PG_USER} -d ${DB_PG_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: bioplatform-redis-prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bioplatform-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  chromadb:
    image: chromadb/chroma:latest
    container_name: bioplatform-chromadb-prod
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - bioplatform-network
    environment:
      - ANONYMIZED_TELEMETRY=false
    restart: always

  # ===========================================
  # BACKEND SERVICES (compilados)
  # ===========================================

  backend-core:
    build:
      context: ./src/Bio.Backend.Core
      dockerfile: Dockerfile
      target: runtime
    container_name: bioplatform-backend-core-prod
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      # Connection strings — names MUST match Program.cs (GetConnectionString).
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING_SQL}
      - ConnectionStrings__ScientificConnection=${DB_CONNECTION_STRING_PG}
      - ConnectionStrings__RedisConnection=${REDIS_CONNECTION_STRING}
      # JWT (section: JwtSettings)
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__ExpiryMinutes=${JWT_EXPIRATION_MINUTES}
      - JwtSettings__RefreshTokenExpiryDays=${JWT_REFRESH_EXPIRATION_DAYS}
      # AWS S3 (section: AwsSettings) — species/product image uploads
      - AwsSettings__BucketName=${S3_BUCKET_NAME}
      - AwsSettings__Region=${AWS_REGION}
      - AwsSettings__AccessKeyId=${AWS_ACCESS_KEY_ID}
      - AwsSettings__SecretAccessKey=${AWS_SECRET_ACCESS_KEY}
      # AI microservice base URL (internal docker network)
      - AiService__BaseUrl=http://ai-service:8000
      # CORS allowed origins
      - CorsSettings__AllowedOrigins__0=${WEB_APP_URL}
      # Scientific catalog auto-seeding (idempotent). Data mounted read-only below.
      - SeedSettings__SeedScientificOnStartup=${SEED_SCIENTIFIC_ON_STARTUP:-true}
      - SeedSettings__ScientificDataPath=/seed/species_catalog
    volumes:
      # Seed data files for the startup seeder.
      # species_catalog: species CSV/JSON + image gallery SQL.
      # weights: holds seed_ai_metadata.sql (ai_model_versions). Resolved as ../weights from the path below.
      - ./src/Bio.Backend.AI/data/species_catalog:/seed/species_catalog:ro
      - ./src/Bio.Backend.AI/data/weights:/seed/weights:ro
    ports:
      - "5000:5000"
    depends_on:
      sqlserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bioplatform-network
    restart: always

  ai-service:
    build:
      context: ./src/Bio.Backend.AI
      dockerfile: Dockerfile
      args:
        TORCH_DEVICE: ${TORCH_DEVICE:-cpu}
    container_name: bioplatform-ai-service-prod
    environment:
      # Names MUST match app/core/config.py (pydantic Settings).
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=${DB_PG_USER}
      - PG_PASSWORD=${DB_PG_PASSWORD}
      - PG_DATABASE=${DB_PG_DATABASE}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DOTNET_API_BASE_URL=http://backend-core:5000
      - DOTNET_WEBHOOK_URL=http://backend-core:5000/api/webhooks/ai/training-completed
      - LOG_LEVEL=INFO
      - CHROMA_HOST=${CHROMA_HOST:-chromadb}
      - CHROMA_PORT=${CHROMA_PORT:-8000}
      - CHROMA_COLLECTION_NAME=${CHROMA_COLLECTION_NAME:-bioplatform_species_dev}
    volumes:
      - ./src/Bio.Backend.AI/scripts:/app/scripts:ro
      - ./src/Bio.Backend.AI/data/species_catalog:/app/data/species_catalog:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bioplatform-network
    restart: always


  # ===========================================
  # FRONTEND SERVICES (compilados)
  # ===========================================

  frontend-web:
    build:
      context: ./src/Bio.Frontend.Web
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* are inlined at build time. Names MUST match the app.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_AI_API_BASE_URL: ${NEXT_PUBLIC_AI_API_BASE_URL}
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME}
        NEXT_PUBLIC_TAX_RATE: ${NEXT_PUBLIC_TAX_RATE}
        NEXT_PUBLIC_SHIPPING_COST_COP: ${NEXT_PUBLIC_SHIPPING_COST_COP}
        NEXT_PUBLIC_FREE_SHIPPING_THRESHOLD: ${NEXT_PUBLIC_FREE_SHIPPING_THRESHOLD}
    container_name: bioplatform-frontend-web-prod
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      - backend-core
      - ai-service
    networks:
      - bioplatform-network
    restart: always

  # NOTA: Frontend Mobile (React Native + Expo) NO se incluye en Docker.
  # Se distribuye como APK/AAB vía EAS Build. Ver README (sección Mobile / APK).

  # ===========================================
  # REVERSE PROXY (Producción)
  # ===========================================

  nginx:
    image: nginx:alpine
    container_name: bioplatform-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend-core
      - ai-service
      - frontend-web
    networks:
      - bioplatform-network
    restart: always

networks:
  bioplatform-network:
    driver: bridge

volumes:
  sqlserver_data:
  postgres_data:
  redis_data:
  chroma_data:
